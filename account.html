<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我的帳號｜InheritancePro</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<div class="disclaimer-bar"><strong>免責聲明</strong>：本平台之計算結果僅供初步參考，不構成法律意見或法律諮詢服務。</div>
<script src="js/supabase-config.js"></script>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --gold: #c4932a;
    --muted: #7a6f62;
    --border: #c8bfb0;
    --soft: #e8e0d0;
    --card: #ffffff;
    --accent: #8b2020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    font-size: 15px;
  }

  /* Header */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .logo span { color: var(--gold); }
  .page-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; font-family: 'DM Mono', monospace; letter-spacing: 0.06em; }


  .home-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.08em;
  }
  .home-link:hover { color: var(--gold); }

  /* Main layout */
  main {
    padding: 28px 20px 80px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Page title */
  .page-title-row {
    margin-bottom: 24px;
  }

  .step-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
  }

  /* Card base */
  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--soft);
  }

  /* Account info rows */
  .info-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--soft);
    gap: 12px;
  }
  .info-row:last-child { border-bottom: none; padding-bottom: 0; }
  .info-row:first-of-type { padding-top: 0; }

  .info-key {
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
    line-height: 1.5;
  }

  .info-val {
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
    text-align: right;
    word-break: break-all;
    line-height: 1.5;
  }

  /* Status badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }
  .badge-free {
    background: var(--soft);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .badge-pro {
    background: linear-gradient(135deg, #c4932a, #e8b84b);
    color: var(--ink);
    border: none;
  }

  /* Redemption form */
  .redeem-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .redeem-input {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .redeem-input::placeholder {
    text-transform: none;
    letter-spacing: 0;
    color: var(--muted);
    opacity: 0.7;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
  }
  .redeem-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .btn-redeem {
    padding: 12px 18px;
    background: var(--ink);
    border: none;
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-redeem:hover { background: #2a1a10; }
  .btn-redeem:disabled { opacity: 0.5; cursor: not-allowed; }

  .redeem-note {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  .redeem-success {
    display: none;
    margin-top: 10px;
    padding: 12px 14px;
    background: #f0fdf6;
    border: 1px solid #a8d8bc;
    border-left: 3px solid #2a6b4a;
    border-radius: 8px;
    font-size: 13px;
    color: #1a5c38;
    line-height: 1.65;
  }
  .redeem-success.visible { display: block; }

  .redeem-error {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    background: #fdf5f5;
    border: 1px solid #e8c0c0;
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent);
    line-height: 1.6;
  }
  .redeem-error.visible { display: block; }

  /* Pro features list */
  .pro-feature-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .pro-feature-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--soft);
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }
  .pro-feature-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .pro-feature-list li:first-child { padding-top: 0; }

  .pro-check {
    width: 18px;
    height: 18px;
    background: linear-gradient(135deg, #c4932a, #e8b84b);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pro-check svg {
    width: 10px;
    height: 10px;
    stroke: #1a1410;
    stroke-width: 2.5;
    fill: none;
  }

  .feature-coming {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: var(--soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 4px;
    vertical-align: middle;
    letter-spacing: 0.04em;
  }

  /* Danger zone */
  .btn-signout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    background: transparent;
    border: 1.5px solid rgba(139, 32, 32, 0.35);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    justify-content: center;
  }
  .btn-signout:hover {
    background: rgba(139, 32, 32, 0.06);
    border-color: var(--accent);
  }

  /* Not-logged-in state */
  .not-logged-in-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
  }
  .not-logged-in-card h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .not-logged-in-card p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .btn-to-login {
    display: inline-block;
    padding: 12px 28px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .btn-to-login:hover { background: #2a1a10; }

  /* Loading state */
  .loading-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .loading-spinner {
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--soft);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Calculation history */
  .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .history-item { background: var(--soft); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .history-item-info { flex: 1; }
  .history-item-title { font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 3px; }
  .history-item-summary { font-size: 12px; color: var(--muted); }
  .history-item-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .history-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
  .history-delete:hover { color: var(--accent); }
  .history-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }
  .tool-badge { display: inline-block; font-size: 10px; font-family: 'DM Mono', monospace; background: var(--soft); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin-right: 6px; color: var(--muted); }

  /* Hidden util */
  .hidden { display: none !important; }

  /* History detail modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,20,16,0.72);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 9000; display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    background: var(--card); border-radius: 16px 16px 0 0;
    width: 100%; max-width: 540px; max-height: 82vh;
    overflow-y: auto; padding: 0 0 40px;
    animation: slideUp 0.25s ease both;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .modal-header {
    position: sticky; top: 0; background: var(--card);
    padding: 16px 20px 12px; border-bottom: 1px solid var(--soft);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 1;
  }
  .modal-title { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; }
  .modal-close {
    background: var(--soft); border: none; border-radius: 50%;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; color: var(--muted); flex-shrink: 0;
  }
  .modal-close:hover { background: var(--border); color: var(--ink); }
  .modal-body { padding: 20px 20px 0; }
  .modal-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .modal-section-title {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--soft);
  }
  .modal-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--soft); font-size: 13px;
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-key { color: var(--muted); flex-shrink: 0; }
  .modal-val { color: var(--ink); font-weight: 500; text-align: right; word-break: break-all; }

  /* History item clickable */
  .history-item { cursor: pointer; transition: background 0.15s; }
  .history-item:hover { background: var(--border); }
  .disclaimer-bar{max-width:560px;margin:0 auto;padding:16px 24px 40px;font-size:11.5px;color:rgba(0,0,0,0.62);line-height:1.7;border-top:1px solid rgba(0,0,0,0.12);}
  .disclaimer-bar strong{color:rgba(0,0,0,0.80);}
</style>
</head>
<body>

<header>
  <a href="index.html" style="text-decoration:none;color:inherit">
    <div class="logo">Inheritance<span>Pro</span></div>
    <div class="page-sub">我的帳號</div>
  </a>
</header>

<main>

  <!-- Loading state -->
  <div id="loading-state" class="loading-state">
    <div class="loading-spinner"></div>
    <div style="font-size:13px;">載入中…</div>
  </div>

  <!-- Not logged in -->
  <div id="not-logged-in" class="hidden">
    <div class="not-logged-in-card">
      <h2>尚未登入</h2>
      <p>請先登入以查看帳號資訊及管理 Pro 功能。</p>
      <a class="btn-to-login" href="/login.html">前往登入</a>
    </div>
  </div>

  <!-- Logged in content -->
  <div id="logged-in-content" class="hidden">

    <div class="page-title-row">
      <div class="step-label">Account</div>
      <h1>我的帳號</h1>
    </div>

    <!-- 1. Account info card -->
    <div class="card">
      <div class="card-title">帳號資訊</div>

      <div class="info-row">
        <span class="info-key">電子信箱</span>
        <span class="info-val" id="account-email">—</span>
      </div>

      <div class="info-row">
        <span class="info-key">會員狀態</span>
        <span class="info-val" id="account-status">—</span>
      </div>

      <div class="info-row" id="activated-row" style="display:none;">
        <span class="info-key">Pro 啟用日期</span>
        <span class="info-val" id="account-activated">—</span>
      </div>

      <div class="info-row">
        <span class="info-key">加入日期</span>
        <span class="info-val" id="account-created">—</span>
      </div>
    </div>

    <!-- 2. Redemption card -->
    <div class="card" id="redeem-card">
      <div class="card-title">序號兌換</div>

      <div class="redeem-row">
        <input
          class="redeem-input"
          type="text"
          id="redeem-input"
          placeholder="輸入兌換序號"
          maxlength="32"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
        >
        <button class="btn-redeem" id="btn-redeem">兌換</button>
      </div>

      <div class="redeem-note">
        贊助者可至贊助頁面取得序號，兌換後立即升級為 Pro 帳號。
      </div>

      <div class="redeem-success" id="redeem-success"></div>
      <div class="redeem-error" id="redeem-error"></div>
    </div>

    <!-- 3. Pro features card (always visible) -->
    <div class="card">
      <div class="card-title">Pro 功能說明</div>
      <ul class="pro-feature-list">
        <li>
          <div class="pro-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
          <span>PDF 報告輸出（各計算機結果）</span>
        </li>
        <li>
          <div class="pro-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
          <span>
            計算紀錄儲存
            <span class="feature-coming">即將推出</span>
          </span>
        </li>
        <li>
          <div class="pro-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
          <span>
            法規更新通知
            <span class="feature-coming">即將推出</span>
          </span>
        </li>
        <li>
          <div class="pro-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
          <span>無廣告體驗</span>
        </li>
      </ul>
    </div>

    <!-- 4. Calculation history card -->
    <div class="card" id="history-card">
      <div class="card-title">🗂 計算紀錄</div>
      <div id="history-list-container">
        <div class="history-empty">載入中…</div>
      </div>
    </div>

    <!-- 5. Danger zone -->
    <div class="card">
      <div class="card-title">帳號操作</div>
      <button class="btn-signout" id="btn-signout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        登出
      </button>
    </div>

  </div><!-- /logged-in-content -->

</main>

<script type="module">
  import { supabase, getProfile, redeemCode } from './js/auth.js';
  import { getCalculations, deleteCalculation } from './js/save.js';

  async function init() {
    const { data: { user } } = await supabase.auth.getUser();

    const loadingEl = document.getElementById('loading-state');
    const notLoggedInEl = document.getElementById('not-logged-in');
    const contentEl = document.getElementById('logged-in-content');

    loadingEl.classList.add('hidden');

    if (!user) {
      notLoggedInEl.classList.remove('hidden');
      return;
    }

    contentEl.classList.remove('hidden');

    // Load calculation history
    renderHistory();

    // Populate account info
    const profile = await getProfile();
    const isPro = profile?.is_pro || false;

    document.getElementById('account-email').textContent = user.email || '—';

    document.getElementById('account-status').innerHTML = isPro
      ? '<span class="badge badge-pro">✦ Pro</span>'
      : '<span class="badge badge-free">免費版</span>';

    if (isPro && profile?.activated_at) {
      const activatedRow = document.getElementById('activated-row');
      activatedRow.style.display = 'flex';
      document.getElementById('account-activated').textContent =
        formatDate(profile.activated_at);
    }

    const createdAt = profile?.created_at || user.created_at;
    document.getElementById('account-created').textContent =
      createdAt ? formatDate(createdAt) : '—';

    // Hide redeem card if already Pro
    if (isPro) {
      document.getElementById('redeem-card').style.display = 'none';
    }

    // Redeem code handler
    document.getElementById('btn-redeem').addEventListener('click', async () => {
      const code = document.getElementById('redeem-input').value.trim();
      const successEl = document.getElementById('redeem-success');
      const errorEl = document.getElementById('redeem-error');
      const btn = document.getElementById('btn-redeem');

      successEl.classList.remove('visible');
      errorEl.classList.remove('visible');

      if (!code) {
        errorEl.textContent = '請輸入兌換序號。';
        errorEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = '兌換中…';

      const result = await redeemCode(code);

      btn.disabled = false;
      btn.textContent = '兌換';

      if (result.error) {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
      } else {
        successEl.innerHTML = `✓ 兌換成功！您已升級為 Pro${result.tier ? '（' + result.tier + '）' : ''}，頁面即將重新載入。`;
        successEl.classList.add('visible');
        document.getElementById('redeem-input').disabled = true;
        btn.disabled = true;
        setTimeout(() => window.location.reload(), 2000);
      }
    });

    // Enter key on redeem input
    document.getElementById('redeem-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-redeem').click();
    });

    // Sign out
    document.getElementById('btn-signout').addEventListener('click', async () => {
      const btn = document.getElementById('btn-signout');
      btn.textContent = '登出中…';
      btn.disabled = true;
      await supabase.auth.signOut();
      window.location.href = '/';
    });
  }

  function formatDate(isoString) {
    try {
      const d = new Date(isoString);
      return d.toLocaleDateString('zh-TW', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    } catch {
      return isoString;
    }
  }

  async function renderHistory() {
    const container = document.getElementById('history-list-container');
    if (!container) return;

    const items = await getCalculations();

    if (!items.length) {
      container.innerHTML = '<div class="history-empty">尚無計算紀錄</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'history-list';

    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'history-item';

      const dateStr = item.created_at ? formatDate(item.created_at) : '—';
      const toolLabel = item.tool || '';
      const title = item.title || '（未命名）';
      const summary = item.summary || '';

      el.innerHTML = `
        <div class="history-item-info">
          <div class="history-item-title">
            ${toolLabel ? `<span class="tool-badge">${escapeHtml(toolLabel)}</span>` : ''}${escapeHtml(title)}
          </div>
          ${summary ? `<div class="history-item-summary">${escapeHtml(summary)}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
          <span class="history-item-date">${dateStr}</span>
          <button class="history-delete" title="刪除" data-id="${item.id}">✕</button>
        </div>
      `;

      // Click to view detail (not on delete button)
      el.addEventListener('click', (e) => {
        if (e.target.closest('.history-delete')) return;
        showDetailModal(item);
      });

      list.appendChild(el);
    });

    container.innerHTML = '';
    container.appendChild(list);

    container.querySelectorAll('.history-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        btn.disabled = true;
        btn.textContent = '…';
        const ok = await deleteCalculation(id);
        if (ok) {
          await renderHistory();
        } else {
          btn.disabled = false;
          btn.textContent = '✕';
        }
      });
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Label maps ──────────────────────────────────────────────────────
  const LABEL_MAP = {
    // 遺產繼承 calculator.html
    regime: '繼承方式', hasWill: '有無遺囑', hasSpouse: '有無配偶',
    totalEstate: '遺產總額', children: '子女人數', parents: '父母人數',
    siblings: '兄弟姊妹人數', grandparents: '祖父母人數',
    deceased_children: '已故子女人數', representatives: '代位繼承人數',
    renounce: '拋棄繼承', childCount: '子女人數',
    spouseShare: '配偶應繼分', totalTax: '遺產稅試算',
    // 剩餘財產 property-split.html
    wifeMarriage: '妻婚後財產', husbandMarriage: '夫婚後財產',
    wifePre: '妻婚前財產', husbandPre: '夫婚前財產',
    wifeDebt: '妻負債', husbandDebt: '夫負債', claim: '請求差額',
    claimant: '請求方',
    // 贍養費 alimony.html
    work: '工作能力', fault: '過失歸屬', caregiver: '曾放棄工作照顧子女',
    age: '年齡層', eligible: '符合請求資格', rejectedReason: '不符合原因',
    low: '贍養費下限', high: '贍養費上限',
    durLow: '給付期間下限（年）', durHigh: '給付期間上限（年）',
    factors: '考量因素', reqGap: '請求方月缺口',
    payDisposable: '對方可支配收入', courtCeiling: '法院參考上限',
    minLife: '最低生活費', city: '縣市地區',
    years: '婚姻年數', marriageYears: '婚姻年數',
    requestorIncome: '請求人月收入', payorIncome: '對方月收入',
    estimatedAlimony: '試算贍養費',
    // 繼承時間軸 inheritance-timeline.html
    deathDate: '死亡日期', deadlines: '期限列表',
    // 脫產偵測 asset-detection.html
    riskLevel: '風險等級', totalScore: '風險分數',
    txCount: '異動筆數', declaredAmt: '申報遺產總額',
    sum2yr: '2年內可疑移轉', results: '分析筆數',
    // 小額損害 minor-damages.html
    category: '損害類型', amount: '請求金額', basis: '法律依據',
    // 時效 prescription.html
    prescriptionYears: '時效年數', startDate: '起算日', expiryDate: '到期日',
    // 勞基法類
    monthlySalary: '月薪', dailyWage: '日薪', hourlyWage: '時薪',
    injuryDays: '受傷天數', compensation: '補償金額',
    overtimePay: '加班費', workYears: '年資',
  };

  // 值對照表
  const VALUE_MAP = {
    regime:  { legal: '法定繼承', testamentary: '遺囑繼承', will: '遺囑繼承' },
    claimant:{ wife: '妻方', husband: '夫方' },
    work:    { none: '無工作能力', limited: '工作能力受限', full: '有工作能力' },
    fault:   { other: '他方過失', mutual: '雙方均有過失', self: '自身過失' },
    age:     { elder: '65歲以上', senior: '50–64歲', middle: '40–49歲', young: '40歲以下' },
    city:    { province: '非六都縣市', taipei: '台北市', newTaipei: '新北市',
               taichung: '台中市', tainan: '台南市', kaohsiung: '高雄市', taoyuan: '桃園市' },
    riskLevel:{ CRITICAL: '極高風險', HIGH: '高風險', MEDIUM: '中風險', LOW: '低風險' },
  };

  // 數字單位對照
  const UNIT_MAP = {
    years:'年', marriageYears:'年', workYears:'年', prescriptionYears:'年',
    durLow:'年', durHigh:'年',
    injuryDays:'天',
    children:'人', parents:'人', siblings:'人', grandparents:'人',
    deceased_children:'人', representatives:'人', childCount:'人',
  };

  // ── Format a single value ────────────────────────────────────────────
  function formatValue(k, v) {
    if (typeof v === 'boolean') return v ? '是' : '否';

    // renounce object → "子女 N 人、父母 N 人…"
    if (k === 'renounce' && typeof v === 'object' && !Array.isArray(v)) {
      const sub = { children:'子女', parents:'父母', siblings:'兄弟姊妹', grandparents:'祖父母' };
      const parts = Object.entries(v).filter(([,n]) => n > 0).map(([sk, n]) => `${sub[sk]||sk} ${n} 人`);
      return parts.length ? parts.join('、') : '無';
    }

    if (Array.isArray(v)) return `${v.length} 筆`;
    if (typeof v === 'object') return `${Object.keys(v).length} 項`;

    // 值對照
    if (VALUE_MAP[k] && VALUE_MAP[k][v] !== undefined) return VALUE_MAP[k][v];

    if (typeof v === 'number') {
      const unit = UNIT_MAP[k];
      if (unit) return `${v}\u00a0${unit}`;
      if (v > 999) return `NT$\u00a0${v.toLocaleString('zh-TW')}`;
      return String(v);
    }

    return String(v);
  }

  // ── 統一日期格式：2026/03/28（補零）──────────────────────────────────
  function fmtDate(isoOrDate) {
    const d = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
    if (isNaN(d)) return String(isoOrDate);
    return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
  }

  // ── Modal ────────────────────────────────────────────────────────────
  function showDetailModal(item) {
    document.getElementById('detail-modal')?.remove();

    const toolLabel = item.tool || '';
    const title = item.title || '（未命名）';
    const dateStr = item.created_at ? formatDate(item.created_at) : '—';
    const data = item.data || {};

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'detail-modal';

    const dataRows = renderDataRows(data);

    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title">${escapeHtml(title)}</div>
          <button class="modal-close" id="modal-close-btn" aria-label="關閉">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-meta">
            ${toolLabel ? escapeHtml(toolLabel) + '　·　' : ''}儲存於 ${dateStr}
          </div>
          ${item.summary ? `<div style="font-size:13px;color:var(--ink);margin-bottom:16px;padding:10px 14px;background:var(--soft);border-radius:8px;">${escapeHtml(item.summary)}</div>` : ''}
          ${dataRows}
          <button id="modal-print-btn" style="
            display:block;width:100%;margin-top:20px;padding:12px;
            background:var(--ink);color:var(--paper);border:none;border-radius:8px;
            font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
          ">⬇ 列印 / 儲存 PDF</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    overlay.querySelector('#modal-close-btn').addEventListener('click', () => overlay.remove());
    // No click-outside close — prevent accidental dismissal

    overlay.querySelector('#modal-print-btn').addEventListener('click', () => {
      printRecord(item);
    });
  }

  function renderDataRows(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      return `<div style="font-size:13px;color:var(--muted);">無詳細資料</div>`;
    }
    const keys = Object.keys(data);
    if (keys.length === 0) return `<div style="font-size:13px;color:var(--muted);">無詳細資料</div>`;

    const rows = keys.map(k => {
      const v = data[k];
      if (v === null || v === undefined) return '';
      const label = LABEL_MAP[k] || k;
      const display = formatValue(k, v);
      return `
        <div class="modal-row">
          <span class="modal-key">${escapeHtml(label)}</span>
          <span class="modal-val">${escapeHtml(display)}</span>
        </div>`;
    }).filter(Boolean);

    return `<div class="modal-section-title">計算資料</div>${rows.join('')}`;
  }

  function printRecord(item) {
    const data = item.data || {};

    // 優先使用計算機存好的原始 print HTML
    if (data._html) {
      const w = window.open('', '_blank');
      if (!w) { alert('請允許彈出視窗以列印'); return; }
      w.document.write(data._html);
      w.document.close();
      w.onload = () => setTimeout(() => w.print(), 400);
      return;
    }

    // 舊紀錄 fallback：簡易表格格式
    const title = item.title || '計算紀錄';
    const dateStr = item.created_at ? formatDate(item.created_at) : '—';
    const summary = item.summary || '';
    const tool = item.tool || '';
    const today = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'});

    const rows = Object.entries(data)
      .filter(([k, v]) => k !== '_html' && v !== null && v !== undefined)
      .map(([k, v]) => {
        const label = LABEL_MAP[k] || k;
        const display = formatValue(k, v);
        return `<tr><td>${label}</td><td>${display}</td></tr>`;
      }).join('');

    const html = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8">
<title>${title}</title>
<style>
  body{font-family:'Noto Sans TC',sans-serif;padding:40px;max-width:600px;margin:0 auto;font-size:13px;color:#1a1410;}
  .header{border-bottom:3px solid #1a1410;padding-bottom:16px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;}
  .logo{font-family:serif;font-size:22px;font-weight:700;}
  .logo span{color:#c4932a;}
  .meta{font-size:11px;color:#7a6f62;text-align:right;line-height:1.8;}
  h2{font-size:18px;font-weight:700;margin-bottom:6px;}
  .summary{background:#f5f0e8;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;}
  td{padding:9px 10px;border-bottom:1px solid #e8e0d0;font-size:13px;}
  td:first-child{color:#7a6f62;width:40%;}
  td:last-child{font-weight:500;text-align:right;}
  .footer{margin-top:36px;padding-top:12px;border-top:1px solid #d0c8b8;font-size:11px;color:#a09880;text-align:center;line-height:1.8;}
  @media print{body{padding:20px;}}
</style></head><body>
<div class="header">
  <div><div class="logo">Inheritance<span>Pro</span></div><div style="font-size:12px;color:#7a6f62;margin-top:4px">${tool ? tool + '　計算紀錄' : '計算紀錄'}</div></div>
  <div class="meta">產出日期：${today}<br>儲存日期：${dateStr}</div>
</div>
<h2>${title}</h2>
${summary ? `<div class="summary">${summary}</div>` : ''}
<table><tbody>${rows}</tbody></table>
<div class="footer">© ${new Date().getFullYear()} InheritancePro &nbsp;·&nbsp; inheritancepro.app<br>本報告僅供參考，不構成法律意見。</div>
</body></html>`;

    const w = window.open('', '_blank');
    if (!w) { alert('請允許彈出視窗以列印'); return; }
    w.document.write(html);
    w.document.close();
    w.onload = () => setTimeout(() => w.print(), 400);
  }

  init();
</script>
</body>
</html>
