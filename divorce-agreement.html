<style>
  /* ── Tool-unique: divorce-agreement.html ── */

  /* Form inputs (this tool uses text/date/textarea beyond what shared CSS scopes to .input-group) */
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--paper); font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink); transition: border-color 0.2s; -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); background: #fff; }
  textarea { resize: none; font-size: 13px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Override: checkbox-row uses align-items:center (shared uses flex-start) */
  .checkbox-row { align-items: center; margin-bottom: 12px; }
  .checkbox-row input[type="checkbox"] { flex-shrink: 0; }

  .gen-btn {
    width: 100%; padding: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500; cursor: pointer; letter-spacing: 0.04em; margin-top: 8px; transition: background 0.2s;
  }
  .gen-btn:hover { background: #6b1818; }

  /* Agreement output */
  #agreeOutput { display: none; margin-top: 20px; }
  .agree-paper {
    background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 32px 28px; font-size: 14px; line-height: 2; color: #111;
    font-family: 'Noto Serif TC', serif;
  }
  .agree-paper h2 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 24px; letter-spacing: 0.1em; }
  .agree-paper .preamble { margin-bottom: 20px; }
  .agree-paper .article { margin-bottom: 16px; }
  .agree-paper .article-title { font-weight: 700; margin-bottom: 4px; }
  .agree-paper .sig-section { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .agree-paper .sig-block { border-top: 1px solid #ccc; padding-top: 12px; font-size: 13px; line-height: 1.8; }
  .agree-paper .blank { display: inline-block; min-width: 80px; border-bottom: 1px solid #555; }

  /* Override: warn-box uses different colors in this tool */
  .warn-box { background: rgba(139,32,32,0.07); border: 1px solid rgba(139,32,32,0.2); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 14px; }
  .warn-box strong { color: var(--danger); }

  .action-row { display: flex; gap: 10px; margin-top: 14px; }
  .print-btn, .copy-btn {
    flex: 1; padding: 13px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; letter-spacing: 0.04em; transition: all 0.2s;
  }
  .print-btn { background: var(--ink); color: #fff; border: none; }
  .print-btn:hover { background: #2a2420; }
  .copy-btn { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }

  @media print {
    header, .card, .gen-btn, .action-row, .warn-box, .subtitle, h1, .page-sub { display: none !important; }
    #agreeOutput { display: block !important; margin: 0; }
    .agree-paper { border: none; padding: 0; }
    main { padding: 0; }

<body>

<header>
  <a href="index.html" style="text-decoration:none;color:inherit">
    <div class="parent-brand"><img class="cl-icon" src="img/choulegal-icon.svg" alt="">周全 <span>ChouLegal</span></div>
    <div class="logo">Inheritance<span>Pro</span></div>
    <div class="page-sub">離婚協議書草稿產生器</div>
  </a>

<main>
  <h1>離婚協議書草稿產生器</h1>
  <p class="subtitle">填寫雙方資料與協議條款，自動生成兩願離婚協議書草稿。僅供參考，正式文件請諮詢律師。</p>

  <!-- 雙方資料 -->
  <div class="card">
    <div class="section-title">甲方（丈夫／一方）</div>
    <div class="two-col">
      <div class="input-group"><label>姓名</label><input type="text" id="aName" placeholder="姓名"></div>
      <div class="input-group"><label>身分證字號</label><input type="text" id="aId" placeholder="A123456789"></div>
    </div>
    <div class="input-group"><label>戶籍地址</label><input type="text" id="aAddr" placeholder="縣市、鄉鎮市區、路段"></div>
  </div>

  <div class="card">
    <div class="section-title">乙方（妻子／另一方）</div>
    <div class="two-col">
      <div class="input-group"><label>姓名</label><input type="text" id="bName" placeholder="姓名"></div>
      <div class="input-group"><label>身分證字號</label><input type="text" id="bId" placeholder="A123456789"></div>
    </div>
    <div class="input-group"><label>戶籍地址</label><input type="text" id="bAddr" placeholder="縣市、鄉鎮市區、路段"></div>
  </div>

  <!-- 子女 -->
  <div class="card">
    <div class="section-title">子女監護</div>
    <div class="checkbox-row">
      <input type="checkbox" id="hasChild" onchange="toggleChild()">
      <label for="hasChild">有未成年子女</label>
    </div>
    <div id="childSection" style="display:none">
      <div class="input-group">
        <label>子女姓名與出生年月日<span class="label-hint">如有多名，以逗號分隔</span></label>
        <input type="text" id="childNames" placeholder="例：王小明（民國100年1月1日）">
      </div>
      <div class="input-group">
        <label>監護權歸屬</label>
        <select id="custodyWho">
          <option value="A">歸甲方單獨行使</option>
          <option value="B">歸乙方單獨行使</option>
          <option value="joint">雙方共同行使</option>
        </select>
      </div>
      <div class="input-group">
        <label>探視安排<span class="label-hint">非監護方</span></label>
        <input type="text" id="visitation" placeholder="例：每月第一、三週六上午10時至下午5時">
      </div>
      <div class="input-group">
        <label>子女扶養費<span class="label-hint">非監護方每月給付金額（元）</span></label>
        <input type="number" id="childSupportAmt" placeholder="0">
      </div>
    </div>
  </div>

  <!-- 財產 -->
  <div class="card">
    <div class="section-title">財產分配</div>
    <div class="input-group">
      <label>剩餘財產差額分配<span class="label-hint">元，可留空</span></label>
      <input type="number" id="propertyAmt" placeholder="0">
    </div>
    <div class="input-group">
      <label>給付方式</label>
      <select id="propertyMethod">
        <option value="lump">一次給付</option>
        <option value="installment">分期給付（請於備註說明期數）</option>
        <option value="none">無財產差額分配</option>
      </select>
    </div>
    <div class="input-group">
      <label>不動產處理<span class="label-hint">可留空</span></label>
      <input type="text" id="realEstate" placeholder="例：坐落台北市○○區○○段○○號不動產移轉登記予乙方">
    </div>
  </div>

  <!-- 贍養費 -->
  <div class="card">
    <div class="section-title">贍養費</div>
    <div class="checkbox-row">
      <input type="checkbox" id="hasAlimony" onchange="toggleAlimony()">
      <label for="hasAlimony">約定給付贍養費</label>
    </div>
    <div id="alimonySection" style="display:none">
      <div class="two-col">
        <div class="input-group"><label>給付方<span class="label-hint">哪方給付</span></label>
          <select id="alimonyPayer"><option value="A">甲方</option><option value="B">乙方</option></select>
        </div>
        <div class="input-group"><label>每月金額<span class="label-hint">元</span></label>
          <input type="number" id="alimonyAmt" placeholder="0">
        </div>
      </div>
      <div class="input-group" style="margin-bottom:0"><label>給付期間</label>
        <input type="text" id="alimonyPeriod" placeholder="例：自離婚登記起算，給付 5 年">
      </div>
    </div>
  </div>

  <!-- 其他條款 -->
  <div class="card">
    <div class="section-title">其他條款（選填）</div>
    <div class="input-group">
      <label>補充約定事項<span class="label-hint">如：互不追究、不主張損害賠償等</span></label>
      <textarea id="extraTerms" rows="3" placeholder="例：雙方同意本協議書經戶政機關辦理離婚登記後，互不再行追究任何民刑事責任。"></textarea>
    </div>
    <div class="input-group" style="margin-bottom:0">
      <label>協議日期</label>
      <input type="date" id="agreeDate">
    </div>
  </div>

  <button class="gen-btn" onclick="generate()">產生協議書草稿</button>

  <div id="agreeOutput">
    <div class="agree-paper" id="agreePaper"></div>

    <div class="warn-box">
      <strong>⚠ 重要提醒：</strong>本草稿僅供參考，不構成法律意見。兩願離婚協議書須經雙方簽名蓋章、2位以上證人見證，並至戶政事務所辦理登記方為有效。涉及不動產或子女監護之約定，建議至法院或公證人處辦理公證。
    </div>

    <div class="action-row">
      <button class="print-btn" onclick="printOrExport('InheritancePro-離婚協議')">🖨 列印 / 儲存 PDF</button>
      <button class="copy-btn" onclick="copyText()">📋 複製全文</button>
    </div>
  </div>
</main>

<script>
  function toggleChild() {
    document.getElementById('childSection').style.display =
      document.getElementById('hasChild').checked ? 'block' : 'none';
  }
  function toggleAlimony() {
    document.getElementById('alimonySection').style.display =
      document.getElementById('hasAlimony').checked ? 'block' : 'none';
  }

  function v(id) { return document.getElementById(id).value.trim(); }
  function blank(text) { return text || '＿＿＿＿'; }
  const FMT = n => parseInt(n || 0).toLocaleString('zh-TW');

  // Safely set text content on an element selected by id
  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // Create a text node safely (escapes all user input)
  function esc(str) {
    return document.createTextNode(str);
  }

  function generate() {
    const aName = blank(v('aName'));
    const aId = blank(v('aId'));
    const aAddr = blank(v('aAddr'));
    const bName = blank(v('bName'));
    const bId = blank(v('bId'));
    const bAddr = blank(v('bAddr'));

    const dateStr = v('agreeDate') ? formatROCDate(v('agreeDate')) : '　　年　月　日';

    const hasChild = document.getElementById('hasChild').checked;
    const hasAlimony = document.getElementById('hasAlimony').checked;

    let articles = [];
    let artNum = 1;

    // Art 1: Divorce (aName/bName are user input, composed into plain text articles)
    articles.push(`第${artNum++}條（離婚合意）\n　甲方${aName}與乙方${bName}雙方同意自願離婚，並依中華民國民法第一千零四十九條規定，共同至戶政機關辦理離婚登記。`);

    // Art: Children
    if (hasChild) {
      const childNames = blank(v('childNames'));
      const custodyWho = document.getElementById('custodyWho').value;
      const custodyText = custodyWho === 'A' ? `由甲方單獨行使` : custodyWho === 'B' ? `由乙方單獨行使` : `由甲乙雙方共同行使`;
      const visitation = v('visitation') || '雙方另行協商';
      const supportAmt = v('childSupportAmt');
      const nonCustody = custodyWho === 'A' ? '乙方' : custodyWho === 'B' ? '甲方' : '—';
      const custody = custodyWho === 'A' ? '甲方' : '乙方';

      let childArt = `第${artNum++}條（子女監護）\n　雙方所生未成年子女 ${childNames}，其親權（監護權）${custodyText}。`;
      if (custodyWho !== 'joint') {
        childArt += `\n　${nonCustody}得依下列約定探視子女：${visitation}。`;
      }
      if (supportAmt && parseInt(supportAmt) > 0) {
        childArt += `\n　${nonCustody}應自離婚登記翌月起，按月於每月五日前給付子女扶養費新臺幣 ${FMT(supportAmt)} 元予${custody}，至子女成年或完成大學教育時止。`;
      }
      articles.push(childArt);
    }

    // Art: Property
    const propertyAmt = v('propertyAmt');
    const propertyMethod = document.getElementById('propertyMethod').value;
    const realEstate = v('realEstate');
    if ((propertyAmt && parseInt(propertyAmt) > 0) || realEstate) {
      let propArt = `第${artNum++}條（財產分配）`;
      if (propertyAmt && parseInt(propertyAmt) > 0 && propertyMethod !== 'none') {
        const methodText = propertyMethod === 'lump' ? '一次' : '分期';
        propArt += `\n　依民法第一千零三十條之一，乙方應給付甲方剩餘財產差額新臺幣 ${FMT(propertyAmt)} 元，以${methodText}方式給付，於離婚登記後三十日內完成。`;
      }
      if (realEstate) {
        propArt += `\n　${realEstate}。`;
      }
      articles.push(propArt);
    }

    // Art: Alimony
    if (hasAlimony) {
      const payer = document.getElementById('alimonyPayer').value === 'A' ? '甲方' : '乙方';
      const payee = document.getElementById('alimonyPayer').value === 'A' ? '乙方' : '甲方';
      const alimonyAmt = v('alimonyAmt');
      const period = blank(v('alimonyPeriod'));
      articles.push(`第${artNum++}條（贍養費）\n　依民法第一千零五十七條，${payer}應按月給付${payee}贍養費新臺幣 ${FMT(alimonyAmt)} 元，${period}。`);
    }

    // Extra terms
    const extra = v('extraTerms');
    if (extra) {
      articles.push(`第${artNum++}條（其他約定）\n　${extra}`);
    }

    // Final article
    articles.push(`第${artNum++}條（協議效力）\n　本協議書一式二份，甲乙雙方各執一份，均具同等法律效力。本協議書經雙方及證人簽名蓋章後生效。`);

    // Build DOM safely — all user input inserted via textContent / createTextNode
    const paper = document.getElementById('agreePaper');
    paper.innerHTML = ''; // clear previous output

    // Title
    const h2 = document.createElement('h2');
    h2.textContent = '兩　願　離　婚　協　議　書'; // static content, safe
    paper.appendChild(h2);

    // Preamble (user data composed line by line)
    const preamble = document.createElement('div');
    preamble.className = 'preamble';
    const preambleLines = [
      '立協議書人：',
      null, // <br>
      '甲方：', aName, '，身分證字號：', aId,
      null,
      '　　　戶籍地址：', aAddr,
      null, null,
      '乙方：', bName, '，身分證字號：', bId,
      null,
      '　　　戶籍地址：', bAddr,
      null, null,
      '茲因雙方感情不睦，無法繼續共同生活，雙方同意依中華民國民法第一千零四十九條規定辦理兩願離婚，並就相關事項協議如下：'
    ];
    preambleLines.forEach(item => {
      if (item === null) {
        preamble.appendChild(document.createElement('br'));
      } else {
        preamble.appendChild(document.createTextNode(item));
      }
    });
    paper.appendChild(preamble);

    // Articles — article text is composed from user input as plain text strings,
    // then inserted via textContent inside a <pre> element (no HTML parsing occurs)
    articles.forEach(a => {
      const articleDiv = document.createElement('div');
      articleDiv.className = 'article';
      const pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:2';
      pre.textContent = a; // textContent prevents any embedded HTML from executing
      articleDiv.appendChild(pre);
      paper.appendChild(articleDiv);
    });

    // Signature section (aId, bId, dateStr are user inputs — inserted via textContent)
    const sigSection = document.createElement('div');
    sigSection.className = 'sig-section';

    function makeSigBlock(role, idVal, date) {
      const block = document.createElement('div');
      block.className = 'sig-block';
      const blankSpan = document.createElement('span');
      blankSpan.className = 'blank';
      block.appendChild(document.createTextNode(role + '簽名：'));
      block.appendChild(blankSpan);
      block.appendChild(document.createElement('br'));
      block.appendChild(document.createTextNode('身分證字號：'));
      block.appendChild(document.createTextNode(idVal));
      block.appendChild(document.createElement('br'));
      block.appendChild(document.createTextNode('日期：'));
      block.appendChild(document.createTextNode(date));
      return block;
    }
    sigSection.appendChild(makeSigBlock('甲方', aId, dateStr));
    sigSection.appendChild(makeSigBlock('乙方', bId, dateStr));
    paper.appendChild(sigSection);

    // Witness section (static content, safe)
    const witnessWrap = document.createElement('div');
    witnessWrap.style.marginTop = '32px';
    witnessWrap.innerHTML = `
      <div style="font-size:13px;margin-bottom:8px">證人（至少2人）：</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div style="border-top:1px solid #ccc;padding-top:10px;font-size:13px;line-height:2">
          證人一 姓名：<span class="blank"></span><br>
          身分證字號：<span class="blank"></span>
        </div>
        <div style="border-top:1px solid #ccc;padding-top:10px;font-size:13px;line-height:2">
          證人二 姓名：<span class="blank"></span><br>
          身分證字號：<span class="blank"></span>
        </div>
      </div>`; // static content, safe
    paper.appendChild(witnessWrap);

    document.getElementById('agreeOutput').style.display = 'block';
    document.getElementById('agreeOutput').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function formatROCDate(dateStr) {
    const d = new Date(dateStr);
    const roc = d.getFullYear() - 1911;
    return `中華民國${roc}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  function copyText() {
    const text = document.getElementById('agreePaper').innerText;
    navigator.clipboard.writeText(text).then(() => alert('已複製到剪貼簿'));
  }

  // Default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('agreeDate').value = today;
</script>
</body>
