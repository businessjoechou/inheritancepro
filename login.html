<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script src="js/theme-boot.js"></script>
<script src="js/ga.js" defer></script>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登入｜InheritancePro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://inheritance.choulegal.com/login.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="js/supabase-config.js"></script>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --gold: #c4932a;
    --muted: #7a6f62;
    --border: #c8bfb0;
    --soft: #e8e0d0;
    --card: #ffffff;
    --accent: #8b2020;
  }

  *:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
  }

  /* Header */
  .login-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .logo span { color: var(--gold); }
  .page-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; font-family: 'Noto Serif TC', serif; letter-spacing: 0.06em; }


  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .login-subtitle {
    font-size: 13px;
    color: rgba(245, 240, 232, 0.55);
    line-height: 1.6;
  }

  /* Card */
  .login-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(200, 191, 176, 0.18);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  /* Apple button */
  .btn-apple-signin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    background: transparent;
    border: 1.5px solid rgba(196, 147, 42, 0.5);
    border-radius: 10px;
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-apple-signin:hover {
    background: rgba(196, 147, 42, 0.08);
    border-color: var(--gold);
  }
  .btn-apple-signin:active { opacity: 0.8; }

  .apple-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: rgba(245, 240, 232, 0.25);
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(200, 191, 176, 0.15);
  }

  /* Email form */
  .email-label {
    display: block;
    font-size: 12px;
    color: rgba(245, 240, 232, 0.5);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .email-input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .email-input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(200, 191, 176, 0.2);
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .email-input::placeholder { color: rgba(245, 240, 232, 0.3); }
  .email-input:focus {
    outline: none;
    border-color: rgba(196, 147, 42, 0.6);
  }

  .btn-send {
    padding: 12px 18px;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    width: 100%;
  }
  .btn-send:hover { background: #d4a33a; }
  .btn-send:active { opacity: 0.85; }
  .btn-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Success message */
  .success-msg {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(42, 107, 74, 0.12);
    border: 1px solid rgba(42, 107, 74, 0.35);
    border-left: 3px solid #2a6b4a;
    border-radius: 8px;
    font-size: 13px;
    color: #a8d8bc;
    line-height: 1.65;
  }
  .success-msg.visible { display: block; }

  /* Error message */
  .error-msg {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(139, 32, 32, 0.12);
    border: 1px solid rgba(139, 32, 32, 0.3);
    border-radius: 8px;
    font-size: 13px;
    color: #e8a0a0;
    line-height: 1.6;
  }
  .error-msg.visible { display: block; }

  /* Back link */
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    color: rgba(245, 240, 232, 0.35);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.2s;
    margin-top: 4px;
  }
  .back-link:hover { color: rgba(245, 240, 232, 0.65); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(26,20,16,0.3);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Note text */
  .login-note {
    text-align: center;
    font-size: 11px;
    color: rgba(245, 240, 232, 0.25);
    margin-top: 18px;
    line-height: 1.7;
    padding: 0 8px;
  }
  .disclaimer-bar{max-width:560px;margin:0 auto;padding:16px 24px 72px;font-size:11.5px;color:rgba(255,255,255,0.35);line-height:1.7;border-top:1px solid rgba(255,255,255,0.08);text-align:center;}
  .disclaimer-bar strong{color:rgba(255,255,255,0.55);}
</style>
</head>
<body>

<div class="login-wrap">

  <div class="login-header">
    <a href="index.html" style="text-decoration:none;color:inherit;display:inline-block;">
      <div class="logo">Inheritance<span>Pro</span></div>
    </a>
    <h1 class="login-title">登入 / 建立帳號</h1>
    <p class="login-subtitle">使用周全法律科技帳號，免費登入</p>
  </div>

  <div class="login-card">

    <!-- Email magic link -->
    <label class="email-label" for="email-input">電子信箱（免密碼登入）</label>
    <div class="email-input-row">
      <input
        class="email-input"
        type="email"
        id="email-input"
        placeholder="your@email.com"
        autocomplete="username"
        inputmode="email"
      >
      <button class="btn-send" id="btn-email-send">送出</button>
    </div>

    <div class="success-msg" id="success-msg">
      ✓ 請查收信箱，點擊信件中的連結即可登入。<br>
      <span style="font-size:11px;opacity:0.75;margin-top:4px;display:block;">連結有效期限為 1 小時，請盡快點擊。</span>
    </div>

    <div class="error-msg" id="error-msg"></div>

  </div>

  <a class="back-link" href="/">← 返回首頁</a>

  <p class="login-note">
    登入即表示您同意我們的<a href="terms.html" style="color:rgba(245,240,232,0.4);">服務條款</a>與<a href="privacy.html" style="color:rgba(245,240,232,0.4);">隱私權政策</a>。<br>
    本站不儲存密碼，僅透過 Email Magic Link 驗證身份。<br>
    由<a href="https://choulegal.com" style="color:rgba(245,240,232,0.4);">周全法律科技 ChouLegal</a> 開發與維運。
  </p>

</div>

<script type="module">
  import { signInWithApple, signInWithEmail, supabase } from './js/auth.js';

  // If already logged in, redirect to account page
  supabase.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
      window.location.href = '/account.html';
    }
  });

  // Also check immediately on load
  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) window.location.href = '/account.html';
  })();

  // Apple sign-in button (only wire up if present in DOM)
  const btnApple = document.getElementById('btn-apple');
  if (btnApple) {
    btnApple.addEventListener('click', async () => {
      btnApple.disabled = true;
      btnApple.innerHTML = `<span class="spinner"></span>登入中…`;
      try {
        await signInWithApple();
      } catch (e) {
        btnApple.disabled = false;
        btnApple.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#f5f0e8" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>使用 Apple 帳號登入`;
        if (e.message !== 'User cancelled') {
          const errorEl = document.getElementById('error-msg');
          errorEl.textContent = '登入失敗：' + e.message;
          errorEl.classList.add('visible');
        }
      }
    });
  }

  // Email magic link
  document.getElementById('btn-email-send').addEventListener('click', async () => {
    const emailInput = document.getElementById('email-input');
    const email = emailInput.value.trim();
    const successEl = document.getElementById('success-msg');
    const errorEl = document.getElementById('error-msg');
    const btn = document.getElementById('btn-email-send');

    // Hide previous messages
    successEl.classList.remove('visible');
    errorEl.classList.remove('visible');

    if (!email) {
      errorEl.textContent = '請輸入電子信箱。';
      errorEl.classList.add('visible');
      emailInput.focus();
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      errorEl.textContent = '請輸入有效的電子信箱格式。';
      errorEl.classList.add('visible');
      emailInput.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = '發送中…';

    const error = await signInWithEmail(email);

    btn.disabled = false;
    btn.textContent = '送出';

    if (error) {
      errorEl.textContent = '發送失敗：' + (error.message || '請稍後再試');
      errorEl.classList.add('visible');
    } else {
      successEl.classList.add('visible');
      emailInput.value = '';
      // Disable form after successful send
      emailInput.disabled = true;
      btn.disabled = true;
    }
  });

  // Submit on Enter key
  document.getElementById('email-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('btn-email-send').click();
    }
  });
</script>

<div class="disclaimer-bar">
  <strong>免責聲明</strong>：本平台之計算結果僅供初步參考，不構成法律意見或法律諮詢服務。
  <div style="margin-top:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    <a href="privacy.html" style="color:rgba(255,255,255,0.4);font-size:11px;text-decoration:underline;">隱私權政策</a>
    <span style="opacity:0.2;font-size:11px;">·</span>
    <a href="terms.html" style="color:rgba(255,255,255,0.4);font-size:11px;text-decoration:underline;">使用者條款</a>
    <span style="opacity:0.2;font-size:11px;">·</span>
    <span style="color:rgba(255,255,255,0.25);font-size:11px;">© 2026 InheritancePro</span>
  </div>
</div>
<script defer src="js/coffee-button.js"></script>
</body>
</html>
