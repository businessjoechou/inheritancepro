<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>登入｜InheritancePro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://inheritancepro.app/login.html">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="js/supabase-config.js"></script>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --gold: #c4932a;
    --muted: #7a6f62;
    --border: #c8bfb0;
    --soft: #e8e0d0;
    --card: #ffffff;
    --accent: #8b2020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
  }

  /* Header */
  .login-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .logo span { color: var(--gold); }
  .page-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; font-family: 'DM Mono', monospace; letter-spacing: 0.06em; }


  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .login-subtitle {
    font-size: 13px;
    color: rgba(245, 240, 232, 0.55);
    line-height: 1.6;
  }

  /* Card */
  .login-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(200, 191, 176, 0.18);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  /* Google button */
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    background: transparent;
    border: 1.5px solid rgba(196, 147, 42, 0.5);
    border-radius: 10px;
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-google:hover {
    background: rgba(196, 147, 42, 0.08);
    border-color: var(--gold);
  }
  .btn-google:active { opacity: 0.8; }

  .google-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: rgba(245, 240, 232, 0.25);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(200, 191, 176, 0.15);
  }

  /* Email form */
  .email-label {
    display: block;
    font-size: 12px;
    color: rgba(245, 240, 232, 0.5);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .email-input-row {
    display: flex;
    gap: 8px;
  }

  .email-input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(200, 191, 176, 0.2);
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .email-input::placeholder { color: rgba(245, 240, 232, 0.3); }
  .email-input:focus {
    outline: none;
    border-color: rgba(196, 147, 42, 0.6);
  }

  .btn-send {
    padding: 12px 18px;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-send:hover { background: #d4a33a; }
  .btn-send:active { opacity: 0.85; }
  .btn-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Success message */
  .success-msg {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(42, 107, 74, 0.12);
    border: 1px solid rgba(42, 107, 74, 0.35);
    border-left: 3px solid #2a6b4a;
    border-radius: 8px;
    font-size: 13px;
    color: #a8d8bc;
    line-height: 1.65;
  }
  .success-msg.visible { display: block; }

  /* Error message */
  .error-msg {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(139, 32, 32, 0.12);
    border: 1px solid rgba(139, 32, 32, 0.3);
    border-radius: 8px;
    font-size: 13px;
    color: #e8a0a0;
    line-height: 1.6;
  }
  .error-msg.visible { display: block; }

  /* Back link */
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: rgba(245, 240, 232, 0.35);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.2s;
    margin-top: 4px;
  }
  .back-link:hover { color: rgba(245, 240, 232, 0.65); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(26,20,16,0.3);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Note text */
  .login-note {
    text-align: center;
    font-size: 11px;
    color: rgba(245, 240, 232, 0.25);
    margin-top: 18px;
    line-height: 1.7;
    padding: 0 8px;
  }
  .disclaimer-bar{max-width:560px;margin:0 auto;padding:16px 24px 40px;font-size:11.5px;color:rgba(255,255,255,0.35);line-height:1.7;border-top:1px solid rgba(255,255,255,0.08);text-align:center;}
  .disclaimer-bar strong{color:rgba(255,255,255,0.55);}
</style>
</head>
<body>

<div class="login-wrap">

  <div class="login-header">
    <a href="index.html" style="text-decoration:none;color:inherit">
    <div class="logo">Inheritance<span>Pro</span></div>
    <div class="page-sub">登入 / 註冊</div>
  </a>
    <h1 class="login-title">登入 / 建立帳號</h1>
    <p class="login-subtitle">免費登入，贊助者可兌換 Pro 功能</p>
  </div>

  <div class="login-card">

    <!-- Google OAuth -->
    <button class="btn-google" id="btn-google">
      <!-- Google 'G' SVG icon -->
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      使用 Google 帳號登入
    </button>

    <!-- Divider -->
    <div class="divider">或</div>

    <!-- Email magic link -->
    <label class="email-label" for="email-input">電子信箱（免密碼登入）</label>
    <div class="email-input-row">
      <input
        class="email-input"
        type="email"
        id="email-input"
        placeholder="your@email.com"
        autocomplete="email"
        inputmode="email"
      >
      <button class="btn-send" id="btn-email-send">送出</button>
    </div>

    <div class="success-msg" id="success-msg">
      ✓ 請查收信箱，點擊信件中的連結即可登入。<br>
      <span style="font-size:11px;opacity:0.75;margin-top:4px;display:block;">連結有效期限為 1 小時，請盡快點擊。</span>
    </div>

    <div class="error-msg" id="error-msg"></div>

  </div>

  <a class="back-link" href="/">← 返回首頁</a>

  <p class="login-note">
    登入即表示您同意我們的服務條款。<br>
    本站不儲存密碼，僅透過 Google 或 Email 驗證身份。
  </p>

</div>

<script type="module">
  import { signInWithGoogle, signInWithEmail, supabase } from './js/auth.js';

  // If already logged in, redirect to account page
  supabase.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
      window.location.href = '/account.html';
    }
  });

  // Also check immediately on load
  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) window.location.href = '/account.html';
  })();

  // Google sign-in
  document.getElementById('btn-google').addEventListener('click', async () => {
    const btn = document.getElementById('btn-google');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>跳轉中…`;
    await signInWithGoogle();
    // Page will redirect; re-enable if something goes wrong
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = `<svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>使用 Google 帳號登入`;
    }, 4000);
  });

  // Email magic link
  document.getElementById('btn-email-send').addEventListener('click', async () => {
    const emailInput = document.getElementById('email-input');
    const email = emailInput.value.trim();
    const successEl = document.getElementById('success-msg');
    const errorEl = document.getElementById('error-msg');
    const btn = document.getElementById('btn-email-send');

    // Hide previous messages
    successEl.classList.remove('visible');
    errorEl.classList.remove('visible');

    if (!email) {
      errorEl.textContent = '請輸入電子信箱。';
      errorEl.classList.add('visible');
      emailInput.focus();
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      errorEl.textContent = '請輸入有效的電子信箱格式。';
      errorEl.classList.add('visible');
      emailInput.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = '發送中…';

    const error = await signInWithEmail(email);

    btn.disabled = false;
    btn.textContent = '送出';

    if (error) {
      errorEl.textContent = '發送失敗：' + (error.message || '請稍後再試');
      errorEl.classList.add('visible');
    } else {
      successEl.classList.add('visible');
      emailInput.value = '';
      // Disable form after successful send
      emailInput.disabled = true;
      btn.disabled = true;
    }
  });

  // Submit on Enter key
  document.getElementById('email-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('btn-email-send').click();
    }
  });
</script>
</body>
</html>

  </div>
</div>
