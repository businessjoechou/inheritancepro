<header>

<main>
  <h1>贈與規劃模擬器</h1>
  <p class="subtitle">比較分年贈與與直接繼承的稅負差異，找出最省稅策略與建議執行年限。</p>

  <div class="card">
    <div class="section-title">A · 基本資料</div>
    <div class="input-group">
      <label>預計移轉財產總額<span class="label-hint">元</span></label>
      <input type="number" id="totalAsset" placeholder="例：30000000" min="0" max="9999999999" oninput="autoCalc()">
    </div>
    <div class="input-group">
      <label>預估遺產稅率級距</label>
      <select id="estateRate" onchange="autoCalc()">
        <option value="0.10">10%（課稅淨額 5,000 萬以下）</option>
        <option value="0.15" selected>15%（5,001 萬～1 億）</option>
        <option value="0.20">20%（1 億以上）</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="section-title">B · 贈與條件</div>
    <div class="input-group">
      <label>可贈與年數<span class="label-hint">可規劃的時間</span></label>
      <div class="slider-value" id="yearsDisplay">10 年</div>
      <div class="slider-wrap">
        <input type="range" id="years" min="1" max="20" value="10" oninput="updateSlider('years','yearsDisplay',v=>v+' 年');autoCalc()">
        <div class="slider-label"><span>1 年</span><span>20 年</span></div>
      </div>
    </div>
    <div class="input-group">
      <label>贈與對象人數<span class="label-hint">（每位贈與人各 244 萬免稅，本工具以 1 位贈與人計算）</span></label>
      <div class="slider-value" id="recipientsDisplay">2 人</div>
      <div class="slider-wrap">
        <input type="range" id="recipients" min="1" max="5" value="2" oninput="updateSlider('recipients','recipientsDisplay',v=>v+' 人');autoCalc()">
        <div class="slider-label"><span>1 人</span><span>5 人</span></div>
      </div>
    </div>
  </div>

  <button class="calc-btn" onclick="calculate()">模擬最優贈與方案</button>

  <div id="results">
    <div class="result-card">
      <div class="result-title">建議方案</div>
      <div class="result-row">
        <span class="lbl">每年免稅贈與額（1 贈與人）</span>
        <span class="val green" id="r-annualFree">—</span>
      </div>
      <div class="result-row">
        <span class="lbl">N 年累積免稅贈與</span>
        <span class="val green" id="r-totalFree">—</span>
      </div>
      <div class="result-row">
        <span class="lbl">剩餘需以其他方式移轉</span>
        <span class="val" id="r-remaining">—</span>
      </div>
      <div id="timelineSection">
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;margin:14px 0 8px">YEAR · PLAN</div>
        <div class="timeline-bar" id="timeline"></div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-title">稅負比較</div>
      <table class="compare-table">
        <thead>
          <tr><th>方案</th><th>移轉方式</th><th>預估稅負</th></tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
      <div class="recommend-banner" id="recommendBanner"></div>
    </div>

    <div class="law-note">
      <strong>說明：</strong>贈與稅免稅額 244 萬元為每位贈與人每年合計（§22），非每位受贈人。超過免稅額部分依10%稅率課稅（§19）。若受贈人為配偶，免稅額另計（不同申報）。本試算不計複利增值、未來法規調整。
    </div>

    <button class="calc-btn" onclick="downloadPDF()" style="margin-top:16px">↓ 匯出 PDF 報告</button>
  </div>

<script>
  const FMT = v => '$ ' + Math.round(v).toLocaleString('zh-TW');
  const FMT_W = v => (v / 10000).toFixed(0) + ' 萬';

  function sanitizeNum(val, max = 9999999999) {
    const n = parseFloat(val);
    if (isNaN(n) || !isFinite(n)) return 0;
    return Math.max(0, Math.min(max, n));
  }

  function updateSlider(id, displayId, fmt) {
    const v = document.getElementById(id).value;
    document.getElementById(displayId).textContent = fmt(v);
  }

  function getVal(id, fallback = 0) {
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) ? fallback : v;
  }

  function autoCalc() {
    if (document.getElementById('results').style.display === 'block') calculate(true);
  }

  // Compute gift tax on amount > 2,440,000
  function giftTax(amount) {
    const taxable = Math.max(0, amount - 2440000);
    return taxable * 0.10;
  }

  // Compute estate tax given net taxable amount
  function estateTax(taxableNet) {
    if (taxableNet <= 0) return 0;
    if (taxableNet <= 50000000) return taxableNet * 0.10;
    if (taxableNet <= 100000000) return taxableNet * 0.15 - 2500000;
    return taxableNet * 0.20 - 7500000;
  }

  function calculate(silent = false) {
    const total = sanitizeNum(getVal('totalAsset'));
    if (!total) return;
    const estateRateApprox = parseFloat(document.getElementById('estateRate').value);
    const years = parseInt(document.getElementById('years').value);
    const recipients = parseInt(document.getElementById('recipients').value);

    const annualFree = 2440000; // per donor
    const totalFreeN = annualFree * years;
    const remaining = Math.max(0, total - totalFreeN);

    // Scenario A: Full inheritance (no gifting)
    // Approximate: use selected rate as flat for simplicity (user already chose bracket)
    const progressiveCorrection = estateRateApprox === 0.15 ? 2500000 : (estateRateApprox === 0.20 ? 7500000 : 0);
    const taxA = total * estateRateApprox - progressiveCorrection;

    // Scenario B: Gift over N years, then inherit remainder
    // Gift tax: if annualFree covers everything this year, no gift tax.
    // Each year we gift annualFree (no tax). Remaining inherited.
    const giftTaxTotal = 0; // all gifts within 244万 exemption
    const inheritTaxB = remaining > 0 ? estateTax(remaining * estateRateApprox / (total > 0 ? 1 : 1)) : 0;
    // Simpler: remaining amount subject to same proportional estate tax
    const taxB = giftTaxTotal + (remaining > 0 ? remaining * estateRateApprox - (remaining / total) * progressiveCorrection : 0);

    // Scenario C: Max recipients gift per year
    // (same donor, 244万 per year is fixed regardless of recipient count)
    // But multiple donors could each give 244万 — note: this tool assumes 1 donor
    const taxC = taxB; // same as B since recipients don't change donor exemption

    const saving = taxA - Math.max(0, taxB);
    const savingPct = total > 0 ? saving / (total * estateRateApprox - progressiveCorrection) : 0;

    document.getElementById('results').style.display = 'block';
    document.getElementById('r-annualFree').textContent = FMT(annualFree);
    document.getElementById('r-totalFree').textContent = FMT(Math.min(total, totalFreeN));
    document.getElementById('r-remaining').textContent = remaining > 0 ? FMT(remaining) : '全數可免稅移轉';

    // Timeline
    const barMax = annualFree;
    let tl = '';
    const showYears = Math.min(years, 8);
    for (let i = 1; i <= showYears; i++) {
      const amt = i * annualFree <= total ? annualFree : Math.max(0, total - (i-1)*annualFree);
      if (amt <= 0) break;
      const w = Math.round((amt / barMax) * 100);
      tl += `<div class="timeline-row"><span class="yr">第${i}年</span><div class="bar" style="width:${w}%"></div><span class="amt">${FMT_W(amt)}</span></div>`;
    }
    if (years > 8 && total > 8 * annualFree) tl += `<div style="font-size:11px;color:rgba(255,255,255,0.35);font-family:'DM Mono',monospace;margin-top:4px">… 共 ${years} 年，每年 244 萬</div>`;
    document.getElementById('timeline').innerHTML = tl;

    // Compare table
    const scenarios = [
      { name: '全額繼承', method: '不做贈與規劃', tax: Math.max(0, taxA), best: false },
      { name: `分 ${years} 年贈與`, method: `每年 ${FMT_W(annualFree)} 免稅贈與，剩餘繼承`, tax: Math.max(0, taxB), best: true },
    ];
    const bestTax = Math.min(...scenarios.map(s => s.tax));
    scenarios.forEach(s => s.best = s.tax === bestTax);

    document.getElementById('compareBody').innerHTML = scenarios.map(s => `
      <tr class="${s.best ? 'best-row' : ''}">
        <td>${s.name}${s.best ? ' ⭐' : ''}</td>
        <td style="font-size:11px">${s.method}</td>
        <td>${FMT(s.tax)}</td>
      </tr>`).join('');

    const savingAmt = Math.max(0, taxA) - Math.max(0, taxB);
    document.getElementById('recommendBanner').innerHTML =
      savingAmt > 0
        ? `<strong>建議採用分年贈與方案</strong><br>預估節稅金額：<strong>${FMT(savingAmt)}</strong>（約佔稅負 ${(savingAmt / Math.max(1, taxA) * 100).toFixed(0)}%）<br>可規劃期間越長、節稅效益越大。`
        : `<strong>說明：</strong>若財產總額低於免稅額 ${FMT(totalFreeN)}，可於 ${years} 年內全數免稅移轉，無需繳納遺產稅。`;

    if (!silent) document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function downloadPDF() {
    const today = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
    const resultsHTML = document.getElementById('results').innerHTML;
    const html = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>InheritancePro 計算報告</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans TC',sans-serif;background:#fff;color:#1a1410;font-size:13px;padding:40px;max-width:700px;margin:0 auto;}.pdf-header{border-bottom:3px solid #1a1410;padding-bottom:20px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;}.pdf-logo{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;}.pdf-logo span{color:#c4932a;}.pdf-meta{font-size:11px;color:#7a6f62;text-align:right;line-height:1.8;font-family:'DM Mono',monospace;}.result-card{background:#1a1410;color:#f5f0e8;border-radius:12px;padding:24px;margin-bottom:14px;break-inside:avoid;}.result-title{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px;}.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);}.result-row:last-child{border-bottom:none;}.lbl{font-size:13px;color:rgba(245,240,232,0.65);}.val{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:#f5f0e8;}.val.red{color:#e8a0a0;}.val.green{color:#a8d8bc;}.val.big{font-size:18px;color:#c4932a;}.total-band{background:rgba(196,147,42,0.15);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}.law-note{background:#f8f8f8;border-left:3px solid #c4932a;border-radius:0 8px 8px 0;padding:10px 14px;font-size:11px;color:#7a6f62;line-height:1.7;margin:14px 0;}.pdf-footer{margin-top:40px;padding-top:16px;border-top:1px solid #c8bfb0;font-size:11px;color:#7a6f62;line-height:1.8;text-align:center;}.pdf-disc{font-size:10px;color:#aaa;margin-top:8px;}button{display:none!important;}@media print{body{padding:20px;}}</style></head><body><div class="pdf-header"><div><div class="pdf-logo">Inheritance<span>Pro</span></div><div style="font-size:12px;color:#7a6f62;margin-top:4px">贈與規劃試算</div></div><div class="pdf-meta">產出日期：${today}</div></div>${resultsHTML}<div class="pdf-footer">© ${new Date().getFullYear()} InheritancePro · inheritancepro.app<div class="pdf-disc">本報告僅供參考，不構成法律意見。實際個案請諮詢執業律師或法律顧問。</div></div></body></html>`;
    exportPDF(html, 'InheritancePro-贈與規劃');
  }
</script>
