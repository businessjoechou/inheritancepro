<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>找不到頁面 404｜InheritancePro</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<script src="js/ga.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1410; --paper:#f5f0e8; --gold:#8b6914; --accent:#8b2020; --muted:#6b5a4a; --border:#d4c8b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:'Noto Sans TC',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.6; }
  .wrap { max-width:520px; width:100%; text-align:center; }
  .code { font-family:'Noto Serif TC',serif; font-size:88px; font-weight:700; color:var(--accent); letter-spacing:.04em; line-height:1; margin-bottom:16px; }
  h1 { font-family:'Noto Serif TC',serif; font-size:22px; font-weight:700; margin-bottom:12px; }
  p { color:var(--muted); font-size:14px; margin-bottom:28px; }
  .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-block; padding:12px 24px; border-radius:10px; text-decoration:none; font-size:14px; font-weight:500; transition:opacity .2s; }
  a.btn-primary { background:var(--ink); color:var(--paper); }
  a.btn-primary:hover { opacity:.85; }
  a.btn-secondary { background:transparent; color:var(--ink); border:1px solid var(--border); }
  a.btn-secondary:hover { background:var(--border); }
  .hint { margin-top:28px; font-size:12px; color:var(--muted); }
  .hint a { color:var(--gold); text-decoration:none; }
  .hint a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main class="wrap">
  <div class="code">404</div>
  <h1>找不到這個頁面</h1>
  <p>您要造訪的頁面可能已搬移、更名，或暫時無法存取。</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">回到首頁</a>
    <a class="btn btn-secondary" href="/calculator.html">遺產稅試算</a>
  </div>
  <div class="hint">
    若您認為這是錯誤，歡迎來信 <a href="mailto:businessjoechou@gmail.com">businessjoechou@gmail.com</a>
  </div>
</main>
</body>
</html>
