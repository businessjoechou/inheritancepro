<style>
  :root {
    --ink: #1a1410; --paper: #f5f0e8; --accent: #8b2020; --gold: #c4932a;
    --soft: #e8e0d0; --muted: #7a6f62; --success: #2a6b4a; --danger: #8b2020;
    --border: #c8bfb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; font-size: 15px; }
  header { background: var(--ink); color: var(--paper); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
  .logo span { color: var(--gold); }
  .page-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; font-family: 'DM Mono', monospace; letter-spacing: 0.06em; }
  .home-link { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; }
  .home-link:hover { color: var(--gold); }
  main { padding: 24px 20px 120px; max-width: 480px; margin: 0 auto; }
  h1 { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
  .card { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  .section-title { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--soft); }
  .factor-item { margin-bottom: 20px; }
  .factor-item:last-child { margin-bottom: 0; }
  .factor-label { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .factor-hint { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .score-row { display: flex; gap: 6px; }
  .score-btn {
    flex: 1; padding: 10px 4px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--paper); font-family: 'DM Mono', monospace; font-size: 13px;
    font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s;
    color: var(--muted);
  }
  .score-btn:hover { border-color: var(--gold); color: var(--gold); }
  .score-btn.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .score-btn[data-val="1"].selected { background: var(--danger); border-color: var(--danger); }
  .score-btn[data-val="2"].selected { background: #b84a4a; border-color: #b84a4a; }
  .score-btn[data-val="3"].selected { background: #8a7020; border-color: #8a7020; }
  .score-btn[data-val="4"].selected { background: #3a6b45; border-color: #3a6b45; }
  .score-btn[data-val="5"].selected { background: var(--success); border-color: var(--success); }
  .score-label-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 4px; }
  .calc-btn {
    width: 100%; padding: 16px; background: var(--ink); color: var(--paper);
    border: none; border-radius: 10px; font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500; cursor: pointer; letter-spacing: 0.04em; margin-top: 8px; transition: background 0.2s;
  }
  .calc-btn:hover { background: #2a2420; }
  #results { display: none; margin-top: 20px; }
  .result-card { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 24px; margin-bottom: 14px; }
  .result-title { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 16px; }
  .score-display { text-align: center; padding: 20px 0 16px; }
  .score-big { font-family: 'DM Mono', monospace; font-size: 56px; font-weight: 700; line-height: 1; }
  .score-max { font-family: 'DM Mono', monospace; font-size: 18px; color: rgba(255,255,255,0.4); }
  .score-stars { font-size: 22px; margin: 8px 0; letter-spacing: 3px; }
  .score-band { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .bar-section { margin-top: 16px; }
  .bar-group { margin-bottom: 12px; }
  .bar-group-name { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; margin-bottom: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bar-label { font-size: 11px; color: rgba(255,255,255,0.6); width: 130px; flex-shrink: 0; line-height: 1.3; }
  .bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .bar-score { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.5); width: 16px; text-align: right; }
  .strategy-box { border-radius: 8px; padding: 14px 16px; margin-top: 4px; font-size: 13px; line-height: 1.8; }
  .strategy-strong { background: rgba(42,107,74,0.2); border: 1px solid rgba(42,107,74,0.35); }
  .strategy-medium { background: rgba(196,147,42,0.15); border: 1px solid rgba(196,147,42,0.35); }
  .strategy-weak { background: rgba(139,32,32,0.15); border: 1px solid rgba(139,32,32,0.3); }
  .strategy-box strong { font-weight: 600; }
  .weak-spots { margin-top: 12px; }
  .weak-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: rgba(255,255,255,0.65); }
  .weak-item:last-child { border-bottom: none; }
  .weak-tag { background: rgba(139,32,32,0.25); color: #f28b6e; border-radius: 4px; padding: 1px 6px; font-family: 'DM Mono', monospace; font-size: 10px; flex-shrink: 0; margin-top: 1px; }
  .copy-btn {
    width: 100%; padding: 14px; background: transparent; color: var(--muted);
    border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px;
    cursor: pointer; font-family: 'Noto Sans TC', sans-serif; letter-spacing: 0.04em; transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
</style>

<body>

<header>
  <div>
    <div class="logo">Inheritance<span>Pro</span></div>
    <div class="page-sub">訴訟強度評估</div>
  </div>
  <a class="home-link" href="index.html">← 返回</a>
</header>

<main>
  <h1>訴訟強度評估</h1>
  <p class="subtitle">針對 11 項關鍵因素逐一評分，系統給出整體訴訟強度與策略建議。</p>

  <div id="factorsContainer"></div>

  <button class="calc-btn" onclick="calculate()">評估訴訟強度</button>

  <div id="results">
    <div class="result-card">
      <div class="result-title">整體評分</div>
      <div class="score-display">
        <div class="score-big" id="r-score">—</div>
        <div class="score-max">/ 55</div>
        <div class="score-stars" id="r-stars"></div>
        <div class="score-band" id="r-band"></div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-title">各面向分析</div>
      <div class="bar-section" id="barSection"></div>
    </div>

    <div class="result-card">
      <div class="result-title">策略建議</div>
      <div class="strategy-box" id="strategyBox"></div>
      <div class="weak-spots" id="weakSpots"></div>
    </div>

    <button class="copy-btn" onclick="copyResults()">📋 複製評估結果</button>
    <a id="toSettlementBtn" href="settlement-calc.html" style="display:none;margin-top:10px;width:100%;padding:15px;background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-size:15px;font-family:'Noto Sans TC',sans-serif;font-weight:600;cursor:pointer;letter-spacing:0.04em;text-decoration:none;text-align:center;display:block">
      → 帶入分數，試算和解金額
    </a>
  </div>
</main>

<script>
  const FACTORS = [
    { id: 'clarity', cat: '事實面', label: '事實清晰度', hint: '1 = 雙方事實主張高度衝突；5 = 事實明確無爭議', low: '高度爭議', high: '事實明確' },
    { id: 'evidence', cat: '事實面', label: '書面證據充分度', hint: '1 = 無任何書面；5 = 完整文件（合約、公證書、銀行紀錄）', low: '無書面', high: '完整文件' },
    { id: 'witness', cat: '事實面', label: '證人可信度', hint: '1 = 無可信證人；5 = 多位可信且無利害關係之證人', low: '無證人', high: '多位強證人' },
    { id: 'law', cat: '法律面', label: '法律依據明確度', hint: '1 = 法律規定模糊或無明文；5 = 有明確法條支持', low: '法律模糊', high: '明文規定' },
    { id: 'precedent', cat: '法律面', label: '有利判例支持', hint: '1 = 無有利判例或有不利判例；5 = 多件有利最高法院判例', low: '無有利判例', high: '充分判例' },
    { id: 'limitation', cat: '法律面', label: '時效狀態', hint: '1 = 已逾時效或即將到期；5 = 時效充裕（剩餘年數多）', low: '時效危急', high: '時效充裕' },
    { id: 'capacity', cat: '對造面', label: '對造財力', hint: '1 = 對造無財力（勝訴也難執行）；5 = 財力充足可執行', low: '無財力', high: '財力充足' },
    { id: 'opposing', cat: '對造面', label: '對造律師強度（預估）', hint: '1 = 對造有強力律師；5 = 對造無律師或律師實力弱', low: '強力律師', high: '無律師' },
    { id: 'counter', cat: '對造面', label: '反訴風險', hint: '1 = 高反訴風險；5 = 無可能反訴', low: '高反訴風險', high: '無反訴' },
    { id: 'mental', cat: '客戶面', label: '客戶心理承受度', hint: '1 = 無法承受長期訴訟壓力；5 = 可全程配合長期抗戰', low: '無法長期', high: '可長期' },
    { id: 'budget', cat: '客戶面', label: '訴訟費用可負擔', hint: '1 = 預算嚴重不足；5 = 預算充足', low: '預算不足', high: '預算充足' },
  ];

  const scores = {};
  FACTORS.forEach(f => scores[f.id] = 0);

  function renderFactors() {
    const cats = [...new Set(FACTORS.map(f => f.cat))];
    let html = '';
    cats.forEach(cat => {
      const catFactors = FACTORS.filter(f => f.cat === cat);
      html += `<div class="card"><div class="section-title">${cat}</div>`;
      catFactors.forEach(f => {
        html += `<div class="factor-item" id="fi-${f.id}">
          <div class="factor-label">${f.label}</div>
          <div class="factor-hint">${f.hint}</div>
          <div class="score-row">
            ${[1,2,3,4,5].map(v => `<button class="score-btn" data-id="${f.id}" data-val="${v}" onclick="setScore('${f.id}',${v})">${v}</button>`).join('')}
          </div>
          <div class="score-label-row"><span>${f.low}</span><span>${f.high}</span></div>
        </div>`;
      });
      html += '</div>';
    });
    document.getElementById('factorsContainer').innerHTML = html;
  }

  function setScore(id, val) {
    scores[id] = val;
    document.querySelectorAll(`.score-btn[data-id="${id}"]`).forEach(btn => {
      btn.classList.toggle('selected', parseInt(btn.dataset.val) === val);
    });
    if (document.getElementById('results').style.display === 'block') calculate(true);
  }

  const BAND_CONFIG = [
    { min: 45, stars: '⭐⭐⭐⭐⭐', label: '極強 — 建議積極訴訟', cls: 'strategy-strong',
      strategy: '各面向評分均高，建議積極提起訴訟。充分準備書狀，鎖定最強論點，但仍應設定和解底線。' },
    { min: 35, stars: '⭐⭐⭐⭐', label: '強 — 訴訟機會大', cls: 'strategy-strong',
      strategy: '整體實力強，勝訴機會高。建議提訴，同時備妥和解條件，若對造在訴訟初期提出合理方案可考慮接受。' },
    { min: 25, stars: '⭐⭐⭐', label: '中等 — 先嘗試調解', cls: 'strategy-medium',
      strategy: '實力中等，訴訟結果難以預料。建議先嘗試調解或律師函催告，若調解失敗再考慮訴訟，並強化弱項證據。' },
    { min: 15, stars: '⭐⭐', label: '弱 — 和解優先', cls: 'strategy-weak',
      strategy: '多項弱點影響勝訴機率，貿然訴訟風險高。建議以和解為主軸，確認對方和解意願後爭取最有利條件。' },
    { min: 0, stars: '⭐', label: '極弱 — 不建議訴訟', cls: 'strategy-weak',
      strategy: '整體條件不利，訴訟可能耗費大量時間金錢卻難以勝訴。建議尋求非訴途徑（調解、仲裁）或評估是否放棄主張。' },
  ];

  function calculate(silent = false) {
    const unanswered = FACTORS.filter(f => !scores[f.id]);
    if (unanswered.length > 0 && !silent) {
      alert(`請完成所有評分。尚未評分：${unanswered.map(f=>f.label).join('、')}`);
      return;
    }

    const total = Object.values(scores).reduce((a, b) => a + b, 0);
    const band = BAND_CONFIG.find(b => total >= b.min);

    document.getElementById('results').style.display = 'block';
    document.getElementById('r-score').textContent = total;
    document.getElementById('r-stars').textContent = band.stars;
    document.getElementById('r-band').textContent = band.label;

    // Bar section by category
    const cats = [...new Set(FACTORS.map(f => f.cat))];
    let barsHtml = '';
    cats.forEach(cat => {
      const catFactors = FACTORS.filter(f => f.cat === cat);
      barsHtml += `<div class="bar-group"><div class="bar-group-name">${cat}</div>`;
      catFactors.forEach(f => {
        const s = scores[f.id] || 0;
        const pct = (s / 5) * 100;
        const color = s <= 1 ? '#f28b6e' : s <= 2 ? '#c4932a' : s <= 3 ? '#8a9a6a' : '#7ecba1';
        barsHtml += `<div class="bar-row">
          <div class="bar-label">${f.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="bar-score">${s || '—'}</div>
        </div>`;
      });
      barsHtml += '</div>';
    });
    document.getElementById('barSection').innerHTML = barsHtml;

    // Strategy
    document.getElementById('strategyBox').className = `strategy-box ${band.cls}`;
    document.getElementById('strategyBox').innerHTML = `<strong>${band.label}</strong><br>${band.strategy}`;

    // Weak spots (score ≤ 2)
    const weakFactors = FACTORS.filter(f => scores[f.id] > 0 && scores[f.id] <= 2);
    if (weakFactors.length > 0) {
      document.getElementById('weakSpots').innerHTML =
        `<div style="font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;margin:12px 0 8px">WEAK POINTS</div>` +
        weakFactors.map(f => `<div class="weak-item"><span class="weak-tag">${scores[f.id]}分</span><span>${f.label}：${f.hint.split('；')[0].replace('1 = ','')}</span></div>`).join('');
    } else {
      document.getElementById('weakSpots').innerHTML = '';
    }

    // Show cross-tool link with score embedded in URL
    const settleBtn = document.getElementById('toSettlementBtn');
    const scoreOut = Math.round((total / 55) * 10);
    settleBtn.href = `settlement-calc.html?strength=${scoreOut}`;
    settleBtn.style.display = 'block';

    if (!silent) document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyResults() {
    const total = Object.values(scores).reduce((a, b) => a + b, 0);
    const band = BAND_CONFIG.find(b => total >= b.min);
    let text = `訴訟強度評估結果\n${'='.repeat(30)}\n`;
    text += `整體分數：${total} / 55　${band.stars}\n`;
    text += `評級：${band.label}\n\n`;
    FACTORS.forEach(f => { text += `${f.label}：${scores[f.id] || '未評'}分\n`; });
    text += `\n（由 InheritancePro 生成）`;
    navigator.clipboard.writeText(text).then(() => alert('已複製到剪貼簿'));
  }

  renderFactors();
</script>
</body>
</html>
