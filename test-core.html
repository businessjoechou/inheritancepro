<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Core 模組測試（開發用）</title>
<link rel="stylesheet" href="css/tool-page.css">
<style>
  .ip-main { max-width: 720px; }
  .test-case { display: flex; justify-content: space-between; padding: 8px 12px;
               border-bottom: 1px solid var(--ip-soft); font-family: var(--ip-font-mono); font-size: 12px; }
  .test-case.pass { background: var(--ip-success-bg); }
  .test-case.fail { background: var(--ip-danger-bg); color: var(--ip-accent); font-weight: 700; }
  .test-case .name { flex: 1; }
  .test-case .val { font-weight: 600; margin-left: 12px; }
  .test-section { margin-bottom: 20px; }
  .test-section h3 { font-family: var(--ip-font-serif); font-size: 16px;
                     margin-bottom: 8px; padding: 8px 12px; background: var(--ip-ink); color: var(--ip-gold); }
  .summary { padding: 16px; background: var(--ip-ink); color: #fff; border-radius: 8px;
             margin-bottom: 20px; text-align: center; }
  .summary .big { font-size: 28px; font-weight: 700; color: var(--ip-gold); }
</style>
</head>
<body>
<header class="ip-header">
  <div class="ip-logo">Inheritance<span>Pro</span><div class="ip-page-sub">CORE TESTS</div></div>
  <a class="ip-home-link" href="index.html">← 首頁</a>
</header>
<main class="ip-main">
  <h1>Core 模組測試</h1>
  <p class="ip-subtitle">Phase 2+ 驗收：確認 core/* 純函式與舊頁面算出同樣結果，含稅年版本與 record schema。</p>
  <div id="summary" class="summary"></div>
  <div id="output"></div>
</main>

<script type="module">
import { calcInheritedPropertyTrap, getPropertyTaxRate, LATEST_PROPERTY_YEAR } from './js/core/property-tax.js';
import { calcStatutoryShare, getHeirTier, getSpouseShare, getForcedShareRate } from './js/core/inheritance.js';
import { calcEstateTax, calcEstateTaxFull, ESTATE_TAX_VERSIONS, LATEST_TAX_YEAR } from './js/core/estate-tax.js';
import { calcGiftTax, calcGiftTaxFull, planGiftYears, GIFT_TAX_VERSIONS } from './js/core/gift-tax.js';
import { calcInterest } from './js/core/interest.js';
import { calcStatuteOfLimitations, yearsBetween } from './js/core/dates.js';
import { createCalcRecord, SCHEMA_VERSION } from './js/core/record.js';

const results = [];
function assert(name, actual, expected, tolerance = 0) {
  const pass = typeof expected === 'number'
    ? Math.abs(actual - expected) <= tolerance
    : JSON.stringify(actual) === JSON.stringify(expected);
  results.push({ name, actual, expected, pass });
}

// === property-tax.js ===
// 新聞案例：售價 900 萬、房貸 700 萬、現值 400 萬、持有 2 年、非自願
const trap = calcInheritedPropertyTrap({
  salePrice: 9_000_000, mortgage: 7_000_000, inheritedValue: 4_000_000,
  holdYears: 2, cpiMult: 1.08, expenseRate: 0.03, isForced: true,
});
assert('[pt] 憑直覺應納稅額 = 175 萬', trap.naive.tax, 1_750_000);
assert('[pt] 懂規則應納稅額 ≈ 28.2 萬', trap.smart.tax, 282_000, 10_000);
assert('[pt] 套用優惠稅率 = 20%', trap.smart.rate, 0.20);
assert('[pt] 差額 ≈ 146.8 萬', trap.savings, 1_468_000, 10_000);
assert('[pt] 回傳帶 taxYear', trap.taxYear, LATEST_PROPERTY_YEAR);
assert('[pt] 回傳帶 lawVersion', !!trap.lawVersion, true);
assert('[pt] 持有 10 年稅率 = 15%', getPropertyTaxRate(10, false), 0.15);
assert('[pt] 持有 2 年一般稅率 = 35%', getPropertyTaxRate(2, false), 0.35);
assert('[pt] 持有 1 年非自願 = 20%', getPropertyTaxRate(1, true), 0.20);

// === inheritance.js ===
const inh1 = calcStatutoryShare({
  totalEstate: 12_000_000, hasSpouse: true, children: 2,
});
assert('[inh] 配偶+2子女 配偶得 400 萬', inh1.heirs[0].amount, 4_000_000);
assert('[inh] 配偶+2子女 第1子得 400 萬', inh1.heirs[1].amount, 4_000_000);
assert('[inh] 配偶+2子女 第2子得 400 萬', inh1.heirs[2].amount, 4_000_000);

const inh2 = calcStatutoryShare({
  totalEstate: 10_000_000, hasSpouse: true, parents: 2,
});
assert('[inh] 配偶+父母 配偶得 500 萬', inh2.heirs[0].amount, 5_000_000);
assert('[inh] 配偶+父母 父1得 250 萬', inh2.heirs[1].amount, 2_500_000);

const inh3 = calcStatutoryShare({
  totalEstate: 10_000_000, hasSpouse: true,
});
assert('[inh] 只有配偶 配偶全拿', inh3.heirs[0].amount, 10_000_000);

assert('[inh] 子女特留分比例 = 1/2', getForcedShareRate(1, 'blood'), 0.5);
assert('[inh] 兄弟姊妹特留分比例 = 1/3', getForcedShareRate(3, 'blood'), 1/3, 0.0001);

// === estate-tax.js ===
assert('[et] 5000萬淨額稅 = 500萬', calcEstateTax(50_000_000), 5_000_000);
assert('[et] 1億淨額稅 = 1250萬', calcEstateTax(100_000_000), 12_500_000);
assert('[et] 2億淨額稅 = 3250萬', calcEstateTax(200_000_000), 32_500_000);
assert('[et] 5000萬指定 2026 年 = 500萬', calcEstateTax(50_000_000, { year: 2026 }), 5_000_000);
assert('[et] 未知年度 fallback 到 latest', calcEstateTax(50_000_000, { year: 9999 }), 5_000_000);
assert('[et] 2026 版本存在', !!ESTATE_TAX_VERSIONS[2026], true);
assert('[et] LATEST_TAX_YEAR = 2026', LATEST_TAX_YEAR, 2026);

const etFull = calcEstateTaxFull({
  totalAssets: 20_000_000, hasSpouse: true, childrenCount: 2,
});
assert('[et] 2000萬配偶+2子女 應納 = 0', etFull.tax, 0);
assert('[et] etFull 帶 taxYear', etFull.taxYear, 2026);
assert('[et] etFull 帶 lawVersion', etFull.lawVersion, '2026-Q1');

// === gift-tax.js ===
assert('[gt] 244萬贈與免稅', calcGiftTaxFull({ priorGifts: 0, currentGift: 2_440_000 }).tax, 0);
assert('[gt] 500萬贈與淨額 = 256萬', calcGiftTaxFull({ priorGifts: 0, currentGift: 5_000_000 }).netGift, 2_560_000);
assert('[gt] 500萬贈與稅 = 25.6萬', calcGiftTaxFull({ priorGifts: 0, currentGift: 5_000_000 }).tax, 256_000);
assert('[gt] 配偶贈與全免稅', calcGiftTaxFull({ priorGifts: 0, currentGift: 10_000_000, isSpouseGift: true }).tax, 0);
assert('[gt] 2026 版本存在', !!GIFT_TAX_VERSIONS[2026], true);
assert('[gt] 回傳帶 taxYear', calcGiftTaxFull({ priorGifts: 0, currentGift: 5_000_000 }).taxYear, 2026);
const plan = planGiftYears(10_000_000);
assert('[gt] 1000萬可免稅 4 年', plan.freeYears, 4);

// === interest.js ===
const int1 = calcInterest({ principal: 1_000_000, ratePct: 5, days: 365 });
assert('[int] 100萬 5% 1年單利 = 5萬', int1.interest, 50_000);

// === dates.js ===
assert('[date] 2024→2026 = 2 年', yearsBetween('2024-01-01', '2026-01-01'), 2);
assert('[date] 2024-06→2025-05 = 0 年', yearsBetween('2024-06-15', '2025-05-15'), 0);

// === record.js ===
const rec = createCalcRecord({
  toolId: 'inherited-property-trap',
  persona: 'lawyer',
  input: { salePrice: 9_000_000 },
  result: { tax: 282_000 },
  taxYear: 2026,
  lawVersion: '2026-Q1',
});
assert('[rec] schemaVersion = 1', rec.schemaVersion, SCHEMA_VERSION);
assert('[rec] toolId 正確', rec.toolId, 'inherited-property-trap');
assert('[rec] persona 正確', rec.persona, 'lawyer');
assert('[rec] taxYear 正確', rec.taxYear, 2026);
assert('[rec] lawVersion 正確', rec.lawVersion, '2026-Q1');
assert('[rec] createdAt 是 ISO 字串', /^\d{4}-\d{2}-\d{2}T/.test(rec.createdAt), true);
assert('[rec] input 有被深拷貝', rec.input.salePrice, 9_000_000);

// === Render ===
const sections = {};
results.forEach(r => {
  const key = r.name.match(/^\[(\w+)\]/)[1];
  sections[key] ??= [];
  sections[key].push(r);
});

const sectionTitles = {
  pt: 'property-tax.js',
  inh: 'inheritance.js',
  et: 'estate-tax.js',
  gt: 'gift-tax.js',
  int: 'interest.js',
  date: 'dates.js',
  rec: 'record.js',
};

const out = document.getElementById('output');
Object.entries(sections).forEach(([key, list]) => {
  const wrap = document.createElement('div');
  wrap.className = 'test-section';
  wrap.innerHTML = `<h3>${sectionTitles[key] || key}</h3>`;
  list.forEach(r => {
    const row = document.createElement('div');
    row.className = 'test-case ' + (r.pass ? 'pass' : 'fail');
    row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name.replace(/^\[\w+\]\s*/, '')}</span>
                     <span class="val">${r.pass ? '' : `got ${r.actual} ≠ ${r.expected}`}</span>`;
    wrap.appendChild(row);
  });
  out.appendChild(wrap);
});

const total = results.length;
const passed = results.filter(r => r.pass).length;
const summary = document.getElementById('summary');
summary.innerHTML = `
  <div class="big">${passed} / ${total}</div>
  <div>${passed === total ? '全部通過 ✓' : `${total - passed} 項失敗`}</div>
`;
if (passed === total) summary.style.background = 'var(--ip-smart-bg)';
else summary.style.background = 'var(--ip-naive-bg)';
</script>
</body>
</html>
